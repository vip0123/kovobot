# Self-hosted Kovobot in one command: docker compose up -d, then open http://localhost:8080.
# Settings and Model provider keys come from .env (copy .env.example); SELF-HOSTING.md walks through them.
# Development and tests use only the database: pnpm db:up.
services:
  kovobot:
    build: .
    # Migrations first, then the server; both read the same settings.
    command: ["sh", "-c", "node apps/api/src/migrate.ts && exec node apps/api/src/main.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      # Always self-hosted here: billing, Plan limits and analytics stay off.
      KOVOBOT_MODE: self-hosted
      NODE_ENV: production
      PORT: "8080"
      WEB_DIST_DIR: /app/apps/web/dist
      DATABASE_URL: postgres://kovobot:kovobot@postgres:5432/kovobot
      # The address people open Kovobot at. The API serves the web app there, so both are one origin.
      API_URL: ${KOVOBOT_URL:-http://localhost:8080}
      APP_URL: ${KOVOBOT_URL:-http://localhost:8080}
      # Computers, with --profile computers: the Computer service below, on its key from .env.
      COMPUTER_SERVICE_URL: http://computers:3100
      COMPUTER_SERVICE_API_KEY: ${COMPUTER_SERVICE_API_KEY:-}
    ports:
      # Only this machine can reach it; on a server, an https reverse proxy goes in front.
      - "127.0.0.1:8080:8080"
    extra_hosts:
      # Lets OPENAI_COMPATIBLE_BASE_URL reach a model server on this machine, e.g. Ollama.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Computers: docker compose --profile computers up -d (SELF-HOSTING.md). The Computer
  # service starts each Computer as a container next to these, through Docker's socket.
  computers:
    profiles: [computers]
    build:
      context: .
      dockerfile: apps/computers/Dockerfile
    environment:
      COMPUTER_SERVICE_URL: http://computers:3100
      COMPUTER_SERVICE_API_KEY: ${COMPUTER_SERVICE_API_KEY:-}
      COMPUTER_IMAGE: kovobot-computer
      COMPUTER_OUTBOUND_MBIT: ${COMPUTER_OUTBOUND_MBIT:-50}
      COMPUTER_NEW_CONNECTIONS_PER_SECOND: ${COMPUTER_NEW_CONNECTIONS_PER_SECOND:-20}
      # Computers join only this network: they reach the internet, and this service
      # reaches their Computer agents, but they can't reach Postgres or the Bot service.
      COMPUTER_DOCKER_NETWORK: kovobot-computers
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [default, computers]
    depends_on:
      computer-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # Builds the image each Computer starts from, then exits.
  computer-image:
    profiles: [computers]
    image: kovobot-computer
    build:
      context: apps/computers
      dockerfile: image/Dockerfile
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # Port 54329 avoids clashing with any other Postgres on 5432.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kovobot
      POSTGRES_PASSWORD: kovobot
      POSTGRES_DB: kovobot
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - kovobot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovobot -d kovobot"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  kovobot-postgres:

networks:
  computers:
    name: kovobot-computers
