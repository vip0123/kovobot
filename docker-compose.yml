# Local Postgres for development and tests: pnpm db:up
# Port 54329 avoids clashing with any other Postgres on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kovobot
      POSTGRES_PASSWORD: kovobot
      POSTGRES_DB: kovobot
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - kovobot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovobot -d kovobot"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  kovobot-postgres:
